apiVersion: apps/v1
kind: Deployment
metadata:
  name: bonos-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bonos-service
  template:
    metadata:
      labels:
        app: bonos-service
    spec:
      containers:
        - name: bonos-service
          image: 465742243019.dkr.ecr.us-east-1.amazonaws.com/bonos-service:latest
          ports:
            - containerPort: 8004
          envFrom:
            - secretRef:
                name: casino-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # startupProbe: le da a la app hasta 30 x 5s = 150s para terminar de
          # conectar a Postgres (esperar_bd) antes de que el liveness la mate.
          # Mientras el startupProbe no pase, el livenessProbe NO se ejecuta.
          startupProbe:
            httpGet:
              path: /livez
              port: 8004
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8004
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: bonos-service
spec:
  selector:
    app: bonos-service
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP